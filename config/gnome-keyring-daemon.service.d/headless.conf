# Standard OS credential storage only; DoorDash handles OAuth and renewal.
[Service]
ExecStart=
ExecStart=/usr/bin/gnome-keyring-daemon --foreground --components=secrets --control-directory=%t/keyring --unlock
StandardInput=file:%h/.local/state/dd-cli-keyring/unlock-secret
UMask=0077

[Install]
WantedBy=
WantedBy=default.target
