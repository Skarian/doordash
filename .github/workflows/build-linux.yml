name: Release Linux executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release x86-64 executable
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: port/requirements-build.txt

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          metadata_files=(port/src/dd_cli-*.dist-info/METADATA)
          shopt -u nullglob

          if [[ "${#metadata_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one dd_cli distribution metadata file" >&2
            exit 1
          fi

          version="$(awk -F ': ' '$1 == "Version" { print $2; exit }' "${metadata_files[0]}")"
          if [[ -z "$version" ]]; then
            echo "Package metadata does not contain a version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match packaged version v${version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement port/requirements-build.txt

      - name: Build and validate executable
        run: bash port/build.sh

      - name: Package executable
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="dd-cli-v${VERSION}-linux-x86_64.tar.gz"

          install -d build-artifacts/package
          install -m 755 dist/dd-cli build-artifacts/package/dd-cli
          tar -C build-artifacts/package -czf "build-artifacts/${archive}" dd-cli
          (
            cd build-artifacts
            sha256sum "${archive}" > "${archive}.sha256"
            sha256sum --check "${archive}.sha256"
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="build-artifacts/dd-cli-v${VERSION}-linux-x86_64.tar.gz"
          gh release create "$GITHUB_REF_NAME" \
            "$archive" \
            "${archive}.sha256" \
            --verify-tag \
            --title "DoorDash CLI v${VERSION} for Linux" \
            --notes "Linux x86-64 build of DoorDash CLI v${VERSION}."
