name: Build Linux executable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-linux.yml"
      - "port/**"
  pull_request:
    paths:
      - ".github/workflows/build-linux.yml"
      - "port/**"

permissions:
  contents: read

jobs:
  build:
    name: Build x86-64 executable
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: port/requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement port/requirements-build.txt

      - name: Build and validate executable
        run: bash port/build.sh

      - name: Package executable
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(dist/dd-cli --version | awk '{print $3}')"
          archive="dd-cli-v${version}-linux-x86_64.tar.gz"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          install -d build-artifacts/package
          install -m 755 dist/dd-cli build-artifacts/package/dd-cli
          tar -C build-artifacts/package -czf "build-artifacts/${archive}" dd-cli
          (
            cd build-artifacts
            sha256sum "${archive}" > "${archive}.sha256"
            sha256sum --check "${archive}.sha256"
          )

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: dd-cli-v${{ steps.package.outputs.version }}-linux-x86_64
          path: |
            build-artifacts/dd-cli-*.tar.gz
            build-artifacts/dd-cli-*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
